<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History of Cars</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Three vertical full-height columns centered horizontally */
    body {
      margin: 0;
      min-height: 100vh;
      background: #070913;
      color: #f4f7fb;
    }

    .vertical-columns {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: clamp(0.5rem, 3vw, 1rem);
      pointer-events: none;
      z-index: 1500;
    }

    .vertical-column {
      pointer-events: auto;
      width: clamp(96px, 12vw, 180px);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .column-btn {
      display: block;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: none;
      outline: none;
      text-decoration: none;
      transition: transform .2s cubic-bezier(.2,.9,.2,1);
      filter: none !important;
      -webkit-filter: none !important;
      transform-origin: center;
      position: relative;
    }

    .column-btn::after{
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.18) !important;
      pointer-events: none;
      filter: none !important;
      -webkit-filter: none !important;
    }

    .vertical-columns:hover .column-btn {
      filter: blur(12px) brightness(0.35);
      opacity: 0.3;
      transition: transform .2s cubic-bezier(.2,.9,.2,1), filter .2s ease, opacity .2s ease;
    }

    .vertical-column:hover .column-btn {
      transform: scale(1.15);
      filter: none !important;
      -webkit-filter: none !important;
      opacity: 1 !important;
    }
    .vertical-column:hover .column-btn::after {
      background: rgba(0,0,0,0.18) !important;
    }

    @media (max-width: 640px){
      .vertical-columns { gap: 0.35rem; }
      .vertical-column { width: 96px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="history.html" class="navbar__logo">HISTORY OF CARS</a>
    <ul class="navbar__links">
      <li><a href="new.html">INTRO</a></li>
      <li><a href="extra.html">PROJECT</a></li>
    </ul>
</nav>

  <div class="vertical-columns" aria-hidden="false">
    <div class="vertical-column">
      <a class="column-btn" href="index.html" title="Lancia 0372" style="background-image: url('0372.jpg'); background-size: auto 130% !important;" aria-label="Lancia 0372"></a>
    </div>
    <div class="vertical-column">
      <a class="column-btn" href="ford.html" title="Ford GT40" style="background-image: url('gt40.jpg'); background-position: 40% center;" aria-label="Ford GT40"></a>
    </div>
    <div class="vertical-column">
      <a class="column-btn" href="bmw.html" title="BMW M3 GTR" style="background-image: url('m3gtr.jpg'); background-position: center 20% !important; background-size: auto 120% !important;" aria-label="BMW M3 GTR"></a>
    </div>
  </div>

</body>
</html>
