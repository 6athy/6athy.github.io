<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lancia Rally</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .highlight { color: #0c0e20; }
    .highlight2 { color: #6294c4; }
    .highlight3 { color: #a10000; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="navbar__logo">HISTORY OF CARS</a>
    <ul class="navbar__links">
      <li><a href="#">INTRO</a></li>
      <li><a href="#">PROJECT</a></li>
      <li><a href="#">OTHER</a></li>
    </ul>
  </nav>

  <div class="card">
    <img class="card__bg" src="037.jpg" alt="Lancia Rally 037" />
    <div class="card__text">
      <p class="card__overtitle"></p>
      <h1 class="card__title">
        <a href="https://en.wikipedia.org/wiki/Lancia_Rally_037" target="_blank">
          Lancia Rally '<span class="highlight">0</span><span class="highlight2">3</span><span class="highlight3">7</span>'
        </a>
      </h1>
      <p class="card__subtitle">1983 Story of that Day</p>
    </div>

    <div class="card__top-right">
      <a href="https://flickr.com/people/32659528@N00" target="_blank">Photo by Brian Snelson</a>
    </div>

    <!-- 재생 버튼 -->
    <div class="play-btn" onclick="openVideo()">
      <div class="play-icon"></div>
    </div>

    <!-- 영상 오버레이 -->
    <div class="video-overlay" id="videoOverlay">
      <div class="video-close" onclick="closeVideo()">✕</div>
      <video id="my-video" controls>
        <source src="video.mp4" type="video/mp4">
      </video>
    </div>

  </div>

  <script>
    function openVideo() {
      document.getElementById('videoOverlay').classList.add('active');
      document.getElementById('my-video').play();
    }

    function closeVideo() {
      document.getElementById('my-video').pause();
      document.getElementById('my-video').currentTime = 0;
      document.getElementById('videoOverlay').classList.remove('active');
    }
  </script>

</body>
</html>
